<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>BaitLogic Admin</title>
  <meta name="theme-color" content="#08100a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="section shell admin-shell">
    <div class="section-heading narrow">
      <span class="section-kicker">Moderation</span>
      <h2>ADMIN <span>DASHBOARD</span></h2>
      <p>In live mode, admins sign in using Supabase magic-link auth. In demo mode, moderation actions write to local browser storage for preview only.</p>
    </div>

    <section class="admin-card">
      <div id="authBlock">
        <label><span>Admin Email</span><input id="adminEmail" type="email" placeholder="you@example.com"></label>
        <div class="table-actions">
          <button class="small-button primary" id="sendMagicLink" type="button">SEND MAGIC LINK</button>
          <button class="small-button" id="demoAdminLogin" type="button">USE DEMO ADMIN</button>
          <a class="small-button" href="/">BACK TO APP</a>
        </div>
        <div class="form-message" id="authMessage"></div>
      </div>
      <div id="sessionBlock" class="hidden">
        <div class="report-meta"><strong id="sessionEmail">Signed in</strong><span id="sessionMode"></span></div>
        <div class="table-actions">
          <button class="small-button" id="refreshAdmin" type="button">REFRESH</button>
          <button class="small-button" id="signOutAdmin" type="button">SIGN OUT</button>
        </div>
      </div>
    </section>

    <section class="admin-grid">
      <article class="admin-card">
        <div class="section-heading"><h2>PENDING <span>REPORTS</span></h2></div>
        <div id="pendingReports" class="report-list"></div>
      </article>
      <article class="admin-card">
        <div class="section-heading"><h2>PENDING <span>CATCHES</span></h2></div>
        <div id="pendingCatches" class="report-list"></div>
      </article>
      <article class="admin-card">
        <div class="section-heading"><h2>LATEST <span>SIGNUPS</span></h2></div>
        <div id="latestSignups" class="report-list"></div>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
