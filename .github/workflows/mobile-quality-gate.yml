name: BaitLogic mobile quality gate

on:
  push:
    branches:
      - audit/approved-design-integration-2026-11-02
  pull_request:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-quality-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baitlogic-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate mobile runtime
        run: npm run check:runtime
      - name: Production TypeScript/Vite build
        run: npm run build
      - name: Test worker routing and Vite PWA build outputs
        run: npm run test:sites
      - name: Enforce mobile-first code splitting
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir = 'dist/client/assets';
          const js = fs.readdirSync(dir).filter(name => name.endsWith('.js'));
          const index = fs.readFileSync('dist/client/index.html', 'utf8');
          const entry = index.match(/src="\/assets\/([^"]+\.js)"/)?.[1];
          if (!entry) throw new Error('Missing built JavaScript entrypoint');
          const entrySource = fs.readFileSync(path.join(dir, entry), 'utf8');
          if (entrySource.includes('CONSERVATION REPORTING · LOCAL')) {
            throw new Error('Desktop dashboard leaked into the initial mobile entry bundle');
          }
          if (!js.some(name => name !== entry)) {
            throw new Error('Expected at least one separately loaded JavaScript chunk');
          }
          console.log('Mobile entry chunk:', entry, fs.statSync(path.join(dir, entry)).size, 'bytes');
          console.log('Separate JavaScript chunks:', js.length - 1);
          NODE
      - name: Install Chromium for mobile browser checks
        run: npx playwright install --with-deps chromium
      - name: Measure interactive mobile startup at simulated 4G
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import { spawn } from 'node:child_process';
          const server = spawn('python3', ['-m','http.server','4178','--bind','127.0.0.1','--directory','dist/client'], {stdio:'ignore'});
          let browser;
          try {
            for(let i=0;i<60;i++){
              try {const r=await fetch('http://127.0.0.1:4178/');if(r.ok)break;}catch{}
              await new Promise(r=>setTimeout(r,200));
            }
            browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:360,height:780},deviceScaleFactor:2,isMobile:true,hasTouch:true,serviceWorkers:'block'});
            const page=await context.newPage();
            const cdp=await context.newCDPSession(page);
            await cdp.send('Network.enable');
            await cdp.send('Network.emulateNetworkConditions',{offline:false,latency:120,downloadThroughput:1_600_000/8,uploadThroughput:750_000/8});
            await page.route('**/api/**',route=>route.fulfill({status:503,contentType:'application/json',body:'{"error":"unavailable"}'}));
            const start=Date.now();
            await page.goto('http://127.0.0.1:4178/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('.bl-primary-cta').waitFor({state:'visible',timeout:15000});
            const ms=Date.now()-start;
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth);
            console.log('Mobile primary action ready in',ms,'ms on simulated 4G; overflow:',overflow);
            if(overflow)throw Error('Horizontal overflow on 360px viewport');
            if(ms>3000)throw Error('Mobile 3-second readiness budget exceeded: '+ms+'ms');
          } finally {await browser?.close();server.kill();}
          NODE
      - name: Measure generated client payload
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='dist/client';
          const files=[];
          function walk(dir){for(const entry of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,entry.name);if(entry.isDirectory())walk(p);else if(/\.(js|css)$/.test(entry.name))files.push({file:p,bytes:fs.statSync(p).size});}}
          walk(root);
          files.sort((a,b)=>b.bytes-a.bytes);
          console.log('Largest JavaScript/CSS outputs (uncompressed):');
          for(const f of files.slice(0,15))console.log((f.bytes/1024).toFixed(1)+' KiB  '+f.file);
          const total=files.reduce((n,f)=>n+f.bytes,0);
          console.log('Total JS/CSS:',(total/1024).toFixed(1),'KiB');
          if(!files.length)process.exitCode=1;
          NODE
