name: BaitLogic Deployment Readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
      BAITLOGIC_PRODUCTION_TARGET: vercel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install locked dependencies
        run: npm ci
        working-directory: mobile-app

      - name: Run source, PWA and backend readiness
        run: npm run check:readiness
        working-directory: mobile-app

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: mobile-app

      - name: Run real-browser mobile and desktop release gate
        run: npm run test:release
        working-directory: mobile-app

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baitlogic-playwright-evidence
          path: |
            mobile-app/playwright-report/
            mobile-app/test-results/
          retention-days: 14
