name: BaitLogic Deployment Readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: baitlogic-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # CI uses Cloudflare's documented public test sitekey when the optional
      # repository secret is absent. Vercel preview/production still use the real key.
      VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
      BAITLOGIC_PRODUCTION_TARGET: vercel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use production Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Scan tracked files for committed credentials
        run: node scripts/scan-secrets.mjs

      - name: Install locked dependencies
        run: npm ci
        working-directory: mobile-app

      - name: Run deployment readiness gate
        run: npm run check:readiness
        working-directory: mobile-app

      - name: Install Chromium for interaction tests
        run: npx playwright install --with-deps chromium
        working-directory: mobile-app

      - name: Run mobile interaction tests
        run: npm run test:runtime
        working-directory: mobile-app
