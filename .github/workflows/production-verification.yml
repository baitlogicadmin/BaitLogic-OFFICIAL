name: BaitLogic Production Verification

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baitlogic-production-verification
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check out authoritative source
        uses: actions/checkout@v4

      - name: Use production Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Git provenance, routes, content types, APIs, and PWA
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BAITLOGIC_PRODUCTION_URL: https://www.bait-logic.com
          PRODUCTION_VERIFY_TIMEOUT_SECONDS: 360
        run: node scripts/verify-production.mjs
